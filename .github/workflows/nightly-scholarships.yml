name: Nightly scholarship refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *" # 2:15 a.m. PST / 3:15 a.m. PDT
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy approved Airtable scholarships
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/sync-airtable.mjs
      - name: Check every official scholarship source
        run: node scripts/check-sources.mjs
      - name: Commit refreshed student list
        run: |
          git config user.name "Toppenish Scholarship Bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet || git commit -m "Refresh scholarship information"
          git push